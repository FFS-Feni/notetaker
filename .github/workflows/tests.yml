name: tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: notetaker, POSTGRES_PASSWORD: notetaker, POSTGRES_DB: notetaker_test }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U notetaker" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["8025:8025", "1025:1025"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Тесты backend (схема, API, правила напоминаний, повторы, 5000 заметок)
        working-directory: backend
        run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Всё приложение в Docker, как у проверяющего
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Браузерные тесты с двумя вкладками
        working-directory: e2e
        env: { CHROMIUM: /nonexistent }  # системного Chromium нет — берём браузер Playwright
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Логи при падении
        if: failure()
        run: docker compose logs backend worker
